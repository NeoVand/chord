name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
        if: matrix.shard == 1
      - run: pnpm lint
        if: matrix.shard == 1
      - run: pnpm test:unit --run
        if: matrix.shard == 1
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/2
      - name: Preserve browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-details-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
      - name: Build Pages artifact
        if: matrix.shard == 1
        env:
          BASE_PATH: /chord
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        if: matrix.shard == 1
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
